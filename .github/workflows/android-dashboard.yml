name: Android dashboard checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-34' 'build-tools;34.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: SDK validation
        run: ./market-ui/gradlew -p market-ui verifyReleaseVersion testDebugUnitTest assembleRelease lintRelease --no-daemon
      - name: Host validation
        run: ./gradlew :shared:testDebugUnitTest :androidApp:testDebugUnitTest :androidApp:assembleDebug :androidApp:assembleDebugAndroidTest :androidApp:lintDebug --no-daemon
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-dashboard-evidence
          path: |
            androidApp/build/reports/
            shared/build/reports/
            market-ui/build/reports/
            androidApp/build/outputs/apk/
